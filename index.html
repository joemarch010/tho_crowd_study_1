<!doctype html>

<html lang="en-US">

  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
</head>

<script>

    /*

    @Reference:
        Taken from https://stackoverflow.com/questions/2450954/how-to-randomize-shuffle-a-javascript-array

    */
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function beginSession() {

        n_scenes = 82
        n_sentinels = 6
        n_scenes = 82
        scenes = Array.apply(null, {length: n_scenes}).map(Number.call, Number)

        shuffleArray(n_scenes)
        scenes = scenes.slice(0, 41)
        indicies = Array.apply(null, {length: 41 * 4}).map(Number.call, Number)
        // indicies.push(158)
        // indicies.push(159)
        // indicies.push(160)
        // indicies.push(161)
        // indicies.push(162)
        // indicies.push(163)
        // shuffleArray(indicies)

        scenes.forEach((x, i) => (indicies[i * 4 + 0] = x * 4 + 0 + 1));
        scenes.forEach((x, i) => (indicies[i * 4 + 1] = x * 4 + 1 + 1));
        scenes.forEach((x, i) => (indicies[i * 4 + 2] = x * 4 + 2 + 1));
        scenes.forEach((x, i) => (indicies[i * 4 + 3] = x * 4 + 3 + 1));

        shuffleArray(indicies)

        localStorage.setItem("indicies", indicies);
        localStorage.setItem("currentIndex", 0);
        localStorage.setItem("observerID", Math.floor(Date.now() / 1000));

        start_trial = 'trial_' + indicies[0].toString() + '.html'
        window.location = start_trial
    } 
</script>

<body>
    <!-- The main header used across all the pages of our website -->

    <header style="text-align: center;">
      <h1>Picture perception study</h1>
    </header>

    <hr style="width: 80%; border-color: #dddddd;"/>

    <div id="main-wrap">
    
        <!-- The main header used across all the pages of our website -->

        <div id="left-side"></div>
        <div id="content">

            <p style="width: 50%; margin-left: 25%;">

                Thank you for agreeing to take part in this study on picture perception. During this study you will be shown a series of images and asked to select which option best describes the time of day at which the picture was taken.
            </p>

            <div style="text-align: center;">
                <a class="button" onclick="beginSession()">Begin study</a>
            </div>

        </div>
        <div id="right-side"></div>
    </div>
</body>
</html>
